[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 只显示失败与错误摘要，日志交给应用自己的 logger 输出
addopts = -ra --strict-markers

markers =
    windows_only: 依赖 Windows 专有依赖（windows-capture / soundcard / pywebview），在 Linux CI 上跳过
    slow: 需要真实时间等待的用例

# 过滤第三方库在导入期产生的噪声告警（swig/soundcard 等），
# 它们与项目代码无关，留着会掩盖真正需要关注的告警。
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
