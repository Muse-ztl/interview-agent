name: CD

# 触发条件：
#   - 推 tag（v1.0.0 等）→ 构建并推送带版本号的镜像
#   - 手动触发 → 构建镜像但**默认不推送**，用于验证 Dockerfile 能构建成功
#
# 刻意不在每次 push master 时都跑：镜像构建要装约 2GB 依赖，
# 且推送到 registry 属于发布动作，应当由打 tag 这种明确意图触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_image:
        description: "是否把镜像推送到 GitHub Container Registry（true / false）"
        # 用 choice 而不是 boolean：workflow_dispatch 的布尔输入在不同
        # 上下文里表现不一致（社区 issue #9343），而 `if:`/`push:` 拿到
        # 字符串 "false" 时是真值，极易把「不推送」误判成「推送」。
        # 这里固定成字符串，再统一做 == 'true' 比较，行为确定。
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository 形如 owner/repo，镜像名必须全小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ════════════════════════════════════════════════════════════
  # 发布前的门禁：测试不过就不发布镜像
  # ════════════════════════════════════════════════════════════
  verify:
    name: 发布前测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r stt_service/requirements.txt

      - name: 运行 pytest
        env:
          AUTH_REQUIRED: "true"
          STT_SERVICE_URL: ""
        run: pytest -q --color=yes

  # ════════════════════════════════════════════════════════════
  # 构建镜像（可选推送）
  # ════════════════════════════════════════════════════════════
  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      # 推送与否只在这里判定一次，后续步骤统一读 SHOULD_PUSH。
      # 好处：`if:` / `push:` / 摘要三处不会各自写一份表达式而走偏，
      # 而且比较的是字符串 'true'，不会出现 "false" 被当成真值的情况。
      - name: 判定是否需要推送
        id: decide
        env:
          # 打了 v* tag 就视为正式发布
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # 手动触发时用户选的字符串（未触发时为 empty）
          WANT_PUSH: ${{ github.event.inputs.push_image }}
        run: |
          if [ "$IS_TAG" = "true" ] || [ "$WANT_PUSH" = "true" ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            echo "将推送镜像（IS_TAG=$IS_TAG WANT_PUSH=$WANT_PUSH）"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "仅构建，不推送（IS_TAG=$IS_TAG WANT_PUSH=$WANT_PUSH）"
          fi

      # 仅当确实要推送时才登录 registry，避免无谓的凭据使用
      - name: 登录 GHCR
        if: steps.decide.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # SKIP_RAG=true：跳过 requirements-rag.txt（sentence-transformers + torch
          # 约 2GB）。RAG 是可选功能，用它换取 CI 构建时间与镜像体积；
          # 需要 RAG 时把这里改成 false，或本地自行构建。
          build-args: |
            SKIP_RAG=true
          push: ${{ steps.decide.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存复用 Docker 层，重复构建显著加速
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像摘要
        env:
          SHOULD_PUSH: ${{ steps.decide.outputs.should_push }}
        run: |
          {
            echo "### 镜像构建完成 🐳"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "推送: $SHOULD_PUSH"
          } >> "$GITHUB_STEP_SUMMARY"