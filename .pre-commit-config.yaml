# ============================================================================
# pre-commit 钩子配置
# ----------------------------------------------------------------------------
# 本地启用（提交前自动检查并修复）：
#     pip install pre-commit
#     pre-commit install
#
# 手动对全部文件跑一遍：
#     pre-commit run --all-files
#
# 更新钩子版本（保持 rev 为最新 tag）：
#     pre-commit autoupdate
#
# CI：本文件同时驱动 pre-commit.ci，无需额外配置。
# ============================================================================

default_language_version:
  python: python3

# 排除构建产物与第三方代码，避免钩子误改非源码文件
exclude: |
  (?x)^(
    frontend/node_modules/.*|
    frontend/dist/.*|
    \.vite/.*|
    \.venv/.*|
    hf_cache/.*|
    chroma_data/.*|
    screenshots/.*|
    logs/.*|
    tts_models/.*|
    .*\.min\.(js|css)
  )$

repos:
  # ── 通用文件检查 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # JSON 校验：package-lock.json 由 npm 生成，体量大且格式不受控，排除
      - id: check-json
        exclude: ^frontend/package-lock\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      # 换行统一为 LF。仓库内文本本就以 LF 存储（见 .gitattributes），
      # 此钩子防止 Windows 下误提交 CRLF。.bat/.cmd 已声明为 binary，
      # 不在此列 —— 它们含中文且依赖 UTF-8 无 BOM，改动会破坏 cmd 解析。
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd)$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # 私有密钥检测：.env 已被 .gitignore 排除，此处兜底防误提交
      - id: detect-private-key

  # ── Python 代码检查（ruff）──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # 静态检查：--fix 自动修复可修复的问题（导入排序、未使用导入等）
      #
      # 注意：仅启用安全规则集（见 pyproject.toml 的 [tool.ruff.lint]）。
      # 未启用 ruff-format —— 它会重写 64/70 个 Python 文件（约 3.7 万行），
      # 与任何功能改动混在一起会让代码审查失去意义。
      # 如需统一格式，建议单独开一个只做格式化的提交，届时再启用：
      #     - id: ruff-format
      - id: ruff
        args: [--fix]

# ============================================================================
# pre-commit.ci 配置
# ----------------------------------------------------------------------------
# 在 https://pre-commit.ci 用 GitHub 账号登录并授权本仓库即可启用，
# 无需在此文件之外做任何设置。
#
# 行为说明：
#   - 每个 PR 自动运行钩子，并直接向 PR 提交修复（autofix）
#   - 每周一约 16:00 UTC 自动提交钩子版本升级 PR（autoupdate）
#   - 在 PR 中评论 `pre-commit.ci run`（单独一行）可重新触发
#   - 提交信息含 [skip ci] / [ci skip] / [skip pre-commit.ci] 时跳过
# ============================================================================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] 自动修复

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] 自动更新 pre-commit 钩子版本"
  autoupdate_schedule: weekly
  # 本地钩子（如依赖未安装的工具）不适合在 CI 中运行；当前没有本地钩子，
  # 预留此位置以便后续按需跳过。
  skip: []
  submodules: false